runtime: plugin
action:
  title: Query Components
  description: "Query components by zone or node"
  arguments:
    - name: identifier
      title: Identifier
      description: Zone or node hostname to query
      required: true
  options:
    - name: kind
      shorthand: k
      title: Kind
      description: Identifier kind to skip auto-detection (zone, node)
      type: string
      default: ""
  result:
    type: object
    description: Query result containing matching components
    properties:
      components:
        type: array
        description: List of components matching the query
        items:
          type: object
          properties:
            name:
              type: string
              description: Component name
            version:
              type: string
              description: Component version
            kind:
              type: string
              description: Component kind (applications, services, softwares, etc)
            zone:
              type: string
              description: Zone where component is attached
    required:
      - components
