runtime: plugin
action:
  title: Detach
  description: "Detach a component from a zone"
  arguments:
    - name: component
      title: Component
      description: Component MRN to detach (e.g., interaction.applications.dashboards)
      required: true
    - name: zone
      title: Zone
      description: Zone to detach from (e.g., platform.interaction.interop)
      required: true
  options:
    - name: source
      shorthand: s
      title: Source
      description: Source directory containing layer definitions
      type: string
      default: "."
  result:
    type: object
    properties:
      component:
        type: string
      zone:
        type: string
      detached:
        type: boolean
